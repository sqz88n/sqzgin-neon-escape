name: Neon Escape APK Build

on:
  push:
    branches: [main, ana]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/25.2.9519653
      ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.2.9519653
      ANDROIDAPI: "33"
      ANDROIDMINAPI: "24"
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl file \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential

      - name: Prepare Android SDK and sdkmanager
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager bulunamadı."
            find "$SDK" -type f -name sdkmanager -print || true
            exit 1
          fi

          mkdir -p "$SDK/tools/bin"
          ln -sfn "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

          test -x "$SDK/tools/bin/sdkmanager"
          test -d "$ANDROID_NDK_HOME"

          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"

          echo "=== Android SDK ==="
          echo "$ANDROID_HOME"
          echo "=== Android NDK ==="
          echo "$ANDROID_NDK_HOME"
          echo "=== Java ==="
          java -version
          echo "=== sdkmanager ==="
          "$SDK/tools/bin/sdkmanager" --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

          python -m pip show buildozer
          python -m pip show python-for-android || true

      - name: Configure project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/SQZGIN_NEON_ESCAPE - Kopya"
          SPEC="$PROJECT/buildozer.spec"

          if [ ! -f "$SPEC" ]; then
            echo "::error::buildozer.spec bulunamadı."
            find "$GITHUB_WORKSPACE" -maxdepth 5 \
              -name buildozer.spec -print
            exit 1
          fi

          python - "$SPEC" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, encoding="utf-8") as f:
              lines = f.readlines()

          settings = {
              "android.sdk_path": "/usr/local/lib/android/sdk",
              "android.ndk_path": (
                  "/usr/local/lib/android/sdk/ndk/25.2.9519653"
              ),
              "android.accept_sdk_license": "True",
          }

          output = []
          seen = set()
          in_app = False
          app_found = False

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("[") and stripped.endswith("]"):
                  if in_app:
                      for key, value in settings.items():
                          if key not in seen:
                              output.append(f"{key} = {value}\n")
                              seen.add(key)

                  in_app = stripped.lower() == "[app]"
                  if in_app:
                      app_found = True

                  output.append(line)
                  continue

              if (
                  in_app
                  and "=" in stripped
                  and not stripped.startswith(("#", ";"))
              ):
                  key = stripped.split("=", 1)[0].strip().lower()

                  if key in settings:
                      if key not in seen:
                          output.append(f"{key} = {settings[key]}\n")
                          seen.add(key)
                      continue

              output.append(line)

          if in_app:
              for key, value in settings.items():
                  if key not in seen:
                      output.append(f"{key} = {value}\n")
                      seen.add(key)

          if not app_found:
              raise SystemExit(
                  "buildozer.spec içinde [app] bölümü bulunamadı."
              )

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(output)

          print("Android ayarları güncellendi.")
          PY

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "=== Proje dosyaları ==="
          ls -la "$PROJECT"

          echo "=== buildozer.spec Android ayarları ==="
          grep -nE '^(android\.sdk_path|android\.ndk_path|android\.accept_sdk_license|android\.api|android\.minapi|requirements|p4a\.bootstrap) *=' \
            "$SPEC" || true

      - name: Build Android APK
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT"

          echo "=== Build ortamı ==="
          python --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          echo "=== Buildozer derlemesi başlıyor ==="

          set +e
          buildozer -v android debug 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          echo "Buildozer çıkış kodu: $BUILD_STATUS"

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::APK derlemesi başarısız oldu. build.log kaydedildi."
            echo "=== Günlükteki hata satırları ==="
            grep -inE \
              'Traceback|Error|ERROR|Exception|failed|not found|No recipe|NDK|Aidl' \
              build.log | tail -n 100 || true
            exit "$BUILD_STATUS"
          fi

          echo "=== Üretilen APK dosyaları ==="
          find bin -maxdepth 2 -type f -name '*.apk' -print

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Escape-Build-Log
          path: |
            SQZGIN_NEON_ESCAPE - Kopya/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Escape-APK
          path: SQZGIN_NEON_ESCAPE - Kopya/bin/*.apk
          if-no-files-found: error
          retention-days: 14
