name: Build Android APK

on:
  push:
    branches: [ "ana", "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK with Buildozer
      env:
        ANDROID_HOMEDIR: /usr/local/lib/android/sdk
      run: |
        # GitHub'ın hazır Android SDK lisanslarını onaylayalım
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platform-tools" || true
        
        cd "SQZGIN_NEON_ESCAPE - Kopya"
        buildozer -v android debug
