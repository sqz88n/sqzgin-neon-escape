name: Neon Escape APK Build

on:
  push:
    branches: [main, ana]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl file \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev build-essential

      - name: Prepare Android SDK and Tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          mkdir -p "$SDK/tools/bin"
          ln -sfn "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"

      - name: Install Buildozer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Prepare Project Directory & Configure buildozer.spec
        shell: bash
        run: |
          set -euo pipefail

          # Boşluklu klasör adından kaçınmak için temiz bir çalışma dizini oluşturuyoruz
          WORK_DIR="$RUNNER_TEMP/project_build"
          mkdir -p "$WORK_DIR"
          cp -r "$GITHUB_WORKSPACE/SQZGIN_NEON_ESCAPE - Kopya/." "$WORK_DIR/"

          SPEC="$WORK_DIR/buildozer.spec"

          if [ ! -f "$SPEC" ]; then
            echo "::error::buildozer.spec bulunamadı."
            exit 1
          fi

          python - "$SPEC" <<'PY'
import sys

path = sys.argv[1]
with open(path, encoding="utf-8") as f:
    lines = f.readlines()

settings = {
    "android.sdk_path": "/usr/local/lib/android/sdk",
    "android.ndk_path": "/usr/local/lib/android/sdk/ndk/25.2.9519653",
    "android.accept_sdk_license": "True",
    "android.api": "33",
    "android.minapi": "24",
}

output = []
in_app = False

for line in lines:
    stripped = line.strip()
    if stripped.startswith("[") and stripped.endswith("]"):
        in_app = (stripped.lower() == "[app]")
    
    if in_app and "=" in stripped and not stripped.startswith(("#", ";")):
        key = stripped.split("=", 1)[0].strip().lower()
        if key in settings:
            output.append(f"{key} = {settings[key]}\n")
            del settings[key]
            continue
            
    output.append(line)

# Eksik kalan ayarları ekle
if settings:
    output.append("\n# Added by CI\n")
    for k, v in settings.items():
        output.append(f"{k} = {v}\n")

with open(path, "w", encoding="utf-8") as f:
    f.writelines(output)

print("buildozer.spec ayarları güncellendi.")
PY

          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"

          STORAGE_DIR="$RUNNER_TEMP/buildozer_storage"
          mkdir -p "$STORAGE_DIR"

          set +e
          buildozer -v android debug --storage-dir "$STORAGE_DIR" 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::APK derlemesi başarısız oldu."
            exit "$BUILD_STATUS"
          fi

          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          cp bin/*.apk "$GITHUB_WORKSPACE/output_apk/" || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Escape-APK
          path: output_apk/*.apk
          if-no-files-found: error
          retention-days: 14
