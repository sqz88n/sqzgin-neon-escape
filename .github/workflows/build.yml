
name: Neon Escape APK Build

on:
  push:
    branches: [main, ana]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PIP_NO_INPUT: "1"
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl file \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager bulunamadı: $SDK"
            exit 1
          fi

          # Lisansları etkileşimsiz kabul et.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

          # Buildozer'ın kullandığı SDK paketlerini yükle.
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

          AIDL="$SDK/build-tools/33.0.2/aidl"

          if [ ! -x "$AIDL" ]; then
            echo "::error::AIDL bulunamadı: $AIDL"
            find "$SDK/build-tools" -name aidl -type f -print || true
            exit 1
          fi

          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          # Buildozer'ın beklediği dizine SDK araçlarını bağla.
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILDOZER_SDK"

          for item in build-tools platforms platform-tools licenses ndk; do
            if [ -d "$SDK/$item" ]; then
              ln -sfn "$SDK/$item" "$BUILDOZER_SDK/$item"
            fi
          done

          echo "Android SDK hazır."
          "$AIDL" --version || true

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Configure project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/SQZGIN_NEON_ESCAPE - Kopya"
          SPEC="$PROJECT/buildozer.spec"

          if [ ! -f "$SPEC" ]; then
            echo "::error::buildozer.spec bulunamadı."
            find "$GITHUB_WORKSPACE" -maxdepth 5 \
              -name buildozer.spec -print
            exit 1
          fi

          # Projedeki mevcut ayarları koru, SDK yollarını güncelle.
          python - "$SPEC" <<'PY'
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              lines = f.readlines()

          settings = {
              "android.sdk_path": "/usr/local/lib/android/sdk",
              "android.ndk_path": (
                  "/usr/local/lib/android/sdk/ndk/25.2.9519653"
              ),
              "android.accept_sdk_license": "True",
          }

          output = []
          seen = set()
          in_app = False

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("[") and stripped.endswith("]"):
                  if in_app:
                      for key, value in settings.items():
                          if key not in seen:
                              output.append(f"{key} = {value}\n")
                              seen.add(key)
                  in_app = stripped.lower() == "[app]"
                  output.append(line)
                  continue

              if (
                  in_app and "=" in stripped
                  and not stripped.startswith(("#", ";"))
              ):
                  key = stripped.split("=", 1)[0].strip().lower()
                  if key in settings:
                      if key not in seen:
                          output.append(f"{key} = {settings[key]}\n")
                          seen.add(key)
                      continue

              output.append(line)

          if in_app:
              for key, value in settings.items():
                  if key not in seen:
                      output.append(f"{key} = {value}\n")

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(output)

          print("buildozer.spec güncellendi.")
          PY

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          buildozer -v android debug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Escape-APK
          path: "SQZGIN_NEON_ESCAPE - Kopya/bin/*.apk"
          if-no-files-found: error
          retention-days: 14
