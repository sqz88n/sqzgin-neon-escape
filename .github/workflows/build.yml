name: Build Neon Escape APK

on:
  push:
    branches: [main, ana]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e
          SDK="$ANDROID_SDK_ROOT"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK bulunamadı: $SDK"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager bulunamadı."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install Android tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager bulunamadı"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

          AIDL="$SDK/build-tools/33.0.2/aidl"

          if [ ! -f "$AIDL" ]; then
            echo "::error::AIDL dosyası bulunamadı"
            find "$SDK/build-tools" -type f -name aidl -print
            exit 1
          fi

          chmod +x "$AIDL"

          echo "AIDL dosyası mevcut: $AIDL"
          file "$AIDL"
          "$AIDL" --version || true

          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Configure project
        shell: bash
        run: |
          set -e
          PROJECT="$GITHUB_WORKSPACE/SQZGIN_NEON_ESCAPE - Kopya"

          if [ ! -f "$PROJECT/buildozer.spec" ]; then
            echo "::error::buildozer.spec bulunamadı."
            find "$GITHUB_WORKSPACE" -maxdepth 4 \
              -name buildozer.spec -print
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT"

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Escape-APK
          path: "SQZGIN_NEON_ESCAPE - Kopya/bin/*.apk"
          if-no-files-found: error
          retention-days: 14
