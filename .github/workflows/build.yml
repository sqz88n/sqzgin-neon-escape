
name: Build Neon Escape APK

on:
  push:
    branches: [main, ana]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl file \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager bulunamadı: $SDK"
            exit 1
          fi

          # Accept licenses without failing on a closed input pipe.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

          test -x "$SDK/build-tools/33.0.2/aidl"
          "$SDK/build-tools/33.0.2/aidl" --version

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"

      - name: Configure Buildozer
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/SQZGIN_NEON_ESCAPE - Kopya"
          SPEC="$PROJECT/buildozer.spec"

          if [ ! -f "$SPEC" ]; then
            find "$GITHUB_WORKSPACE" -maxdepth 5 \
              -name buildozer.spec -print
            echo "::error::buildozer.spec bulunamadı"
            exit 1
          fi

          python - "$SPEC" <<'PY'
          import configparser
          import sys

          path = sys.argv[1]

          cfg = configparser.ConfigParser(
              interpolation=None,
              strict=False,
              inline_comment_prefixes=("#", ";")
          )
          cfg.read(path, encoding="utf-8")

          if not cfg.has_section("app"):
              raise SystemExit("[app] bölümü bulunamadı")

          settings = {
              "android.sdk_path": "/usr/local/lib/android/sdk",
              "android.ndk_path": (
                  "/usr/local/lib/android/sdk/ndk/25.2.9519653"
              ),
              "android.accept_sdk_license": "True",
              "android.api": "33",
              "android.minapi": "23",
              "android.build_tools_version": "33.0.2",
          }

          lines = open(path, encoding="utf-8").readlines()
          output = []
          in_app = False
          seen = set()

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("[") and stripped.endswith("]"):
                  if in_app:
                      for key, value in settings.items():
                          if key not in seen:
                              output.append(f"{key} = {value}\n")
                  in_app = stripped.lower() == "[app]"
                  output.append(line)
                  continue

              if in_app and "=" in stripped and not stripped.startswith(("#", ";")):
                  key = stripped.split("=", 1)[0].strip().lower()
                  if key in settings:
                      if key not in seen:
                          output.append(f"{key} = {settings[key]}\n")
                          seen.add(key)
                      continue

              output.append(line)

          if in_app:
              for key, value in settings.items():
                  if key not in seen:
                      output.append(f"{key} = {value}\n")

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(output)

          print("Buildozer SDK ayarları yazıldı.")
          PY

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"

          echo "SDK: $ANDROID_HOME"
          grep -E 'android\.(sdk_path|ndk_path|api|minapi|build_tools_version|accept_sdk_license)' \
            buildozer.spec

          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Escape-APK
          path: "SQZGIN_NEON_ESCAPE - Kopya/bin/*.apk"
          if-no-files-found: error
          retention-days: 14
